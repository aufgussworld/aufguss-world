<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Turniej Trzech Saun — demo nowych funkcji</title>
  <meta name="description" content="Wersja demonstracyjna z nowymi funkcjami karty oceny (suwak punktacji, oceny innych zawodników) — do akceptacji przed wdrożeniem.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#5c1520">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon-16.png">
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
  <link rel="modulepreload" href="https://unpkg.com/htm@3.1.1/preact/standalone.module.js">
  <link rel="stylesheet" href="../css/app.css">
  <link rel="stylesheet" href="css/beta.css">
  <!-- Demo nowych funkcji: wspólny kod z ../js, ale podmienione moduły (judge.js, model.js, templates.js, store.js)
       z tego folderu. Mapa importów: ../js/<plik> → ./js/<plik> dla podmienionych; wpis ./js/<plik> → ./js/<plik> pilnuje,
       żeby podmieniony moduł importowany z wnętrza bety też był wersją z bety (dokładny wpis wygrywa z prefiksem);
       pozostałe importy z ./js/ wracają do ../js. Własne dane przykładowe (demoKey) — karty z templates.js bety. -->
  <script type="importmap">
    { "imports": {
      "../js/judge.js": "./js/judge.js", "./js/judge.js": "./js/judge.js",
      "../js/model.js": "./js/model.js", "./js/model.js": "./js/model.js",
      "../js/templates.js": "./js/templates.js", "./js/templates.js": "./js/templates.js",
      "../js/store.js": "./js/store.js", "./js/store.js": "./js/store.js",
      "./js/": "../js/"
    } }
  </script>
</head>
<body>
  <div id="app"><p class="boot">Ładowanie systemu sędziowskiego…</p></div>
  <noscript><p style="padding:24px">Ta aplikacja wymaga włączonego JavaScriptu.</p></noscript>
  <script>window.TTS_CONFIG = { mode: 'demo', demoKey: 'tts-demo-beta-v1' };</script>
  <script type="module" src="../js/app.js"></script>
</body>
</html>
